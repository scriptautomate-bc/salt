<div id="module-funcs"></div>

<script>
(function () {
    var target = document.getElementById('module-funcs');
    if (!target) {
        return;
    }

    function buildLocalToc() {
        var heading = document.createElement('h4');
        heading.textContent = 'Table of Contents';
        target.appendChild(heading);

        var list = document.createElement('ul');
        target.appendChild(list);

        var headerLinks = document.querySelectorAll('dt .headerlink');
        headerLinks.forEach(function (link) {
            var parts = link.href.split('.');
            var label = parts[parts.length - 1];

            var item = document.createElement('li');
            var anchor = document.createElement('a');
            anchor.href = link.href;
            anchor.textContent = label;
            item.appendChild(anchor);
            list.appendChild(item);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', buildLocalToc);
    } else {
        buildLocalToc();
    }
})();
</script>
